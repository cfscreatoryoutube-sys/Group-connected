function dlgShow(o){return new Promise(res=>{

  const bg=document.createElement('div');bg.className='dlg-bg';
  const box=document.createElement('div');box.className='dlg-box';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');

  if(f.size>50*1024*1024)throw new Error('File too large (max 50 MB)');

    x.setRequestHeader('apikey',SB_KEY);if(SB_KEY.startsWith('eyJ'))x.setRequestHeader('Authorization','Bearer '+SB_KEY);

  ${linksRow(g.links)}<div class="tabs">${T('feed','📣 Announcements')}${T('artists','🎤 Artists')}${T('fans','Fan board')}${T('moments','Moments')}${T('schedule','Schedule')}${T('letters',own?'Inbox':'Fan letters')}${mgr?T('requests','Requests'+(G.requests.filter(r=>r.status==='pending').length?' ('+G.requests.filter(r=>r.status==='pending').length+')':'')):''}</div>${b}`}
function pcard(p){const L=G.likes.filter(l=>l.pid===p.id),C=G.comments.filter(c=>c.pid===p.id).sort((a,b)=>a.ts-b.ts),liked=L.some(l=>l.u===me);
  return `<div class="card post"><div class="row">${av(p.u)}<span class="who" style="cursor:pointer" onclick="go('profile','${p.u}')">${esc(nm(p.u))}</span>${p.kind==='artist'?'<span class="tag ok">Artist</span>':''}<span class="mut">${new Date(p.ts).toLocaleString()}</span></div>
  <div style="white-space:pre-wrap;margin:8px 0">${esc(p.text)}</div>${media(p.media)}${vid(p.video)}${trans[p.id]?`<div class="reply mut">${esc(trans[p.id])}</div>`:''}
  <div class="row" style="margin-top:8px"><button class="s" onclick="like('${p.id}')">${liked?'❤️':'🤍'} ${L.length}</button><button class="s" onclick="tog('${p.id}')">💬 ${C.length}</button>${sample?`<button class="s" onclick="translate('${p.id}')">🌐 Translate</button>`:''}<button class="s" onclick="reportPost('${p.id}')">Report</button>${isAdmin?`<button class="s" style="color:#e5484d" onclick="delAny('posts','${p.id}')">🗑</button>`:''}</div>
  ${open.has(p.id)?`<div style="margin-top:8px">${C.map(c=>`<div class="reply"><b style="cursor:pointer" onclick="go('profile','${c.u}')">${esc(nm(c.u))}</b> <span class="mut">${new Date(c.ts).toLocaleString()}</span><div style="white-space:pre-wrap">${esc(c.text)}</div>${isAdmin?`<button class="s" style="color:#e5484d;font-size:12px" onclick="delAny('comments','${c.id}')">🗑</button>`:''}</div>`).join('')}<div class="row" style="margin-top:8px"><input id="ci-${p.id}" placeholder="Write a reply…" style="flex:1"><button class="p" onclick="comment('${p.id}')">Reply</button></div></div>`:''}</div>`}
function pollCard(p){const vs=G.votes.filter(v=>v.pid===p.id),tot=vs.length,my=vs.find(v=>v.u===me);
  return `<div class="card post"><span class="tag ok">Poll</span> <b>${esc(p.q)}</b>${p.opts.map((o,i)=>{const n=vs.filter(v=>v.i===i).length,pc=tot?Math.round(n*100/tot):0;return `<button class="s opt" onclick="vote('${p.id}',${i})"><i style="width:${pc}%"></i><span>${my&&my.i===i?'✓ ':''}${esc(o)} · ${n} (${pc}%)</span></button>`}).join('')}<div class="mut" style="margin-top:6px">${tot} vote${tot===1?'':'s'}</div></div>`}
const tog=id=>{open.has(id)?open.delete(id):open.add(id);render()};
async function like(id){const r=db.doc("likes/"+id+"_"+me);G.likes.some(l=>l.pid===id&&l.u===me)?await r.delete():await r.set({pid:id,gid,u:me})}
async function comment(id){const i=$('#ci-'+id),t=i.value.trim();if(!t)return;i.value='';const p=G.posts.find(x=>x.id===id);
  await db.collection("comments").add({pid:id,gid,u:me,text:t.slice(0,500),ts:Date.now()});if(p&&p.u!==me)notify(p.u,'@'+me+' replied to your post',gid)}
async function translate(id){const p=G.posts.find(x=>x.id===id);if(!p)return;trans[id]='Translating…';render();
  try{const r=await(await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(p.text.slice(0,450))+'&langpair=Autodetect|'+navigator.language.slice(0,2))).json();trans[id]=r.responseData.translatedText}catch(e){trans[id]='Translation unavailable'}render()}
async function post(k){const t=$('#pt').value.trim(),v=$('#pv')?$('#pv').value.trim():'';if(!t&&!pfile&&!v&&!vfile)return;if(v&&!/^https?:\/\//.test(v)){gcAlert('Video link must start with https://');return}$('#pt').value='';if($('#pv'))$('#pv').value='';let vurl='';if(vfile){const f=vfile;vfile=null;try{vurl=await uploadVideo(f,toast)}catch(x){toast('Video upload failed: '+x.message,4000);return}}const m=await up(),d={gid,u:me,kind:k,text:t.slice(0,1000),ts:Date.now()};if(m)d.media=m;if(vurl||v)d.video=vurl||v;
  await db.collection("posts").add(d);if(k==='artist')notifyAll('New post from @'+me)}
async function moment(){const t=$('#pt').value.trim();if(!t&&!pfile)return;$('#pt').value='';const m=await up(),d={gid,u:me,text:t.slice(0,300),ts:Date.now()};if(m)d.media=m;
  await db.collection("moments").add(d);notifyAll('New moment from @'+me)}
async function createPoll(){const q=$('#pq').value.trim(),o=$('#po').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,6);if(!q||o.length<2)return;
  await db.collection("polls").add({gid,u:me,q,opts:o,ts:Date.now()});notifyAll('New poll from @'+me)}
const vote=(id,i)=>db.doc("votes/"+id+"_"+me).set({pid:id,gid,u:me,i});
async function addEvent(){const t=$('#et').value.trim(),d=$('#ed2').value;if(!t||!d)return;await db.collection("events").add({gid,u:me,title:t,date:d,ts:Date.now()});notifyAll('New event "'+t+'" from @'+me)}
async function setLive(){const u=$('#lv').value.trim();if(!/^https?:\/\//.test(u))return;await db.doc("groups/"+gid).update({live:u});notifyAll('@'+me+' is live now!')}
const endLive=()=>db.doc("groups/"+gid).update({live:''});
async function letter(){const t=$('#pt').value.trim();if(!t)return;$('#pt').value='';const g=groups.find(x=>x.id===gid);
  await db.collection("letters").add({gid,from:me,involved:[uid,g.uid,g.labelUid].filter(Boolean),text:t.slice(0,3000),ts:Date.now()});[g.by,g.label].filter(Boolean).forEach(x=>notify(x,'New fan letter from @'+me,gid))}
async function reply(id){const t=$('#r-'+id).value.trim();if(!t)return;const l=G.letters.find(x=>x.id===id);
  await db.doc("letters/"+id).update({reply:t.slice(0,2000),rts:Date.now()});if(l)notify(l.from,'@'+me+' replied to your letter',gid)}
init();
</script>
<script>
(function(){const side=$('#side'),T=$('#sbT'),P=$('#sbP'),fine=matchMedia('(hover:hover) and (pointer:fine)');let pinned=ls.get('gc_pin')==='1',open=false,t;
function apply(){const e=pinned||open;side.classList.toggle('exp',e);side.classList.toggle('pin',pinned);document.body.classList.toggle('pinned',pinned);T.setAttribute('aria-expanded',String(e));P.setAttribute('aria-pressed',String(pinned));P.querySelector('span').textContent=pinned?'Unpin menu':'Pin menu'}
window.sbToggle=()=>{if(pinned){pinned=false;open=false;ls.set('gc_pin','0')}else open=!open;apply()};
window.sbPin=()=>{pinned=!pinned;open=false;ls.set('gc_pin',pinned?'1':'0');apply()};
side.addEventListener('mouseenter',()=>{if(!fine.matches)return;clearTimeout(t);open=true;apply()});
side.addEventListener('mouseleave',()=>{if(!fine.matches)return;t=setTimeout(()=>{open=false;apply()},160)});
side.addEventListener('focusin',()=>{if(!fine.matches)return;open=true;apply()});
side.addEventListener('focusout',e=>{if(fine.matches&&!side.contains(e.relatedTarget)){open=false;apply()}});
side.addEventListener('click',e=>{if(!fine.matches&&!pinned&&e.target.closest('nav button')){open=false;apply()}});
document.addEventListener('click',e=>{if(open&&!pinned&&!side.contains(e.target)){open=false;apply()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open&&!pinned){open=false;apply()}});
apply()})();
</script></body></html>

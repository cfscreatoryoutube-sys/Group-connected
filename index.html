  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.14),0 8px 18px color-mix(in srgb,var(--ac) 34%,transparent);text-shadow:0 1px 0 rgba(255,255,255,.28);transition:transform .12s,filter .12s}
button.p:active,a.p:active{transform:translateY(1px);filter:brightness(.96)}
button.s,label.s{background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 90%,var(--line)));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.05)}
#side,header#hdr,header{-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),var(--sh)}
#side nav button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 24%,transparent),color-mix(in srgb,var(--ac) 12%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px color-mix(in srgb,var(--ac) 30%,transparent)}
#side nav button.on i{color:var(--ac);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ac) 55%,transparent))}
.hero,.banner{background:
  radial-gradient(420px 260px at 90% 0,color-mix(in srgb,var(--ac) 34%,transparent),transparent 70%),
  linear-gradient(135deg,color-mix(in srgb,var(--ac) 20%,var(--bg)),var(--bg) 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -40px 60px -40px color-mix(in srgb,var(--ac) 14%,transparent),var(--sh)}
/* shop themes: glass panels over the picture */
html.t-on .card,html.t-on .item,html.t-on .fl,html.t-on .dlg-box{background:var(--card);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5)}
html.t-on #side,html.t-on header#hdr,html.t-on header{background:var(--card)}
html.t-on button.s,html.t-on textarea,html.t-on input,html.t-on select{background:color-mix(in srgb,var(--bg) 55%,transparent)}
html.t-on .hero,html.t-on .banner{background:var(--card)}
html.t-on .hero::before,html.t-on .hero::after{display:none}
html.t-on button.p{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
html.t-gold button.p,html.t-liquid button.p{color:#fff}
html.t-gold button.p{color:#2a1c00;text-shadow:0 1px 0 rgba(255,255,255,.4)}
/* Liquid Glass */
html.t-liquid .card,html.t-liquid .item,html.t-liquid .fl,html.t-liquid #side,html.t-liquid header#hdr,html.t-liquid header,html.t-liquid .dlg-box,html.t-liquid .hero{
  background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.2) 55%,rgba(255,255,255,.4));
  -webkit-backdrop-filter:blur(26px) saturate(1.9);backdrop-filter:blur(26px) saturate(1.9);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1.5px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.5),0 18px 44px rgba(70,90,180,.22)}
html.t-liquid button.s,html.t-liquid input,html.t-liquid textarea,html.t-liquid select{background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html.t-liquid button.p{background:linear-gradient(180deg,rgba(255,255,255,.55) 0,rgba(110,170,255,.85) 45%,#2f7bff 100%);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 10px 24px rgba(47,123,255,.4)}
html.t-liquid #side nav button.on{background:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(47,123,255,.25)}
.ei{display:inline-flex;vertical-align:-3px;margin:0 2px}
.ic.lg{width:34px;height:34px;color:var(--ac)}
.feat .em{display:flex;align-items:center;margin-bottom:6px}


/* ===== reels: pause + progress ===== */
.pp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:76px;color:#fff;opacity:0;pointer-events:none;transition:opacity .15s;text-shadow:0 2px 14px #000a;z-index:1}
.pp.show{opacity:.9}
.prg{position:absolute;left:0;right:0;bottom:0;height:6px;background:#fff3;cursor:pointer;z-index:2}.prg i{display:block;height:100%;width:0;background:var(--ac)}
/* ===== comments sheet ===== */
.cm-bg{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center;animation:cmfade .18s ease}
.cm{width:100%;max-width:520px;max-height:82vh;max-height:82dvh;background:var(--bg);color:var(--fg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px #0006;animation:cmup .24s cubic-bezier(.2,.9,.3,1)}
.cm-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}.cm-h b{flex:1;font-size:16px}
.cm-x{width:34px;height:34px;min-height:0!important;padding:0;border-radius:50%;border:0;background:var(--card);color:var(--fg);cursor:pointer}
.cm-l{overflow:auto;flex:1;padding:6px 16px;min-height:120px}
.cm-i{display:flex;gap:10px;padding:10px 0;animation:cmfade .2s ease}.cm-i+.cm-i{border-top:1px solid var(--line)}
.cm-b{flex:1;min-width:0}.cm-n{font-weight:700;font-size:13px;cursor:pointer}.cm-t{font-size:12px;color:var(--mut);margin-left:6px;font-weight:400}
.cm-c{white-space:pre-wrap;word-break:break-word;margin-top:2px;line-height:1.4}
.cm-tag{font-size:10px;background:var(--ac);color:#000;border-radius:8px;padding:1px 6px;margin-left:6px;font-weight:700}
.cm-d{background:none;border:0;color:var(--mut);cursor:pointer;font-size:12px;padding:0;min-height:0!important;margin-left:8px}
.cm-e{text-align:center;color:var(--mut);padding:34px 0}
.cm-f{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cm-f input{flex:1;border-radius:22px;background:var(--card)}
.cm-s{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#000;font-weight:800;font-size:18px;cursor:pointer;flex:none}
@keyframes cmup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes cmfade{from{opacity:0}to{opacity:1}}
/* ===== liquid glass between sidebar buttons ===== */
#glass{position:absolute;left:0;top:0;width:0;height:0;border-radius:14px;pointer-events:none;z-index:0;opacity:0;
 background:rgba(0,184,150,.2);
 background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.1)),color-mix(in srgb,var(--ac) 24%,transparent);
 -webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:blur(10px) saturate(180%);
 border:1px solid rgba(255,255,255,.55);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -8px 14px rgba(255,255,255,.1),0 8px 20px rgba(0,184,150,.28);
 transition:transform .5s cubic-bezier(.2,.9,.25,1.18),width .5s cubic-bezier(.2,.9,.25,1.18),height .5s cubic-bezier(.2,.9,.25,1.18),opacity .25s ease}
#glass.go{animation:liquid .6s ease}
@keyframes liquid{0%{border-radius:14px}30%{border-radius:28px 10px 28px 10px}60%{border-radius:12px 26px 12px 26px}100%{border-radius:14px}}
#side nav button.on{background:transparent!important;box-shadow:none!important;color:var(--fg)}
#side button{z-index:1}
button,label.s,a.p{transition:background .25s ease,color .25s ease,border-color .25s ease,transform .18s ease,box-shadow .25s ease}
button:active:not(:disabled){transform:scale(.97)}
@media(prefers-reduced-motion:reduce){#glass,#glass.go{transition:none;animation:none}.cm,.cm-bg,.cm-i{animation:none}}
.pp .ic.sm{width:72px;height:72px;filter:drop-shadow(0 2px 14px #000a)}.pp .ei{margin:0}
.cm-x .ic,.dlg-x .ic{width:14px;height:14px}.cm-s .ic{width:18px;height:18px}.rb .ic{width:26px;height:26px}

/* turns leftover emoji in buttons and text into the matching SVG icon */
(function(){
  const M={'🗑':'trash','🎥':'video','⚙':'settings','⛓':'chain','🔔':'bell','📎':'paperclip','🔁':'repeat','✉':'mail','⏳':'clock','📷':'camera','📣':'megaphone','👑':'crown','⬇':'download','🔴':'radio','🔊':'volume','🔇':'mute','➤':'send','✕':'x','▶':'play'};
  const HERO={'🎤':'mic','👯':'users','🏷':'tag'};
  const SPLIT=/(🗑|🎥|⚙|⛓|🔔|📎|🔁|✉|⏳|📷|📣|👑|⬇)️?/,TEST=/🗑|🎥|⚙|⛓|🔔|📎|🔁|✉|⏳|📷|📣|👑|⬇|🔴|🔊|🔇|➤|✕|▶/;
  const SKIP='textarea,script,style,select,option,title,[contenteditable]';
  function fix(n){
    const p=n.parentElement;if(!p||p.closest(SKIP)||!TEST.test(n.nodeValue))return;
    const parts=n.nodeValue.split(SPLIT),f=document.createDocumentFragment();
    parts.forEach((t,i)=>{
      if(i%2===0){if(t)f.appendChild(document.createTextNode(t));return}
      const s=document.createElement('span');s.className='ei';s.setAttribute('aria-hidden','true');s.innerHTML=ic(M[t],'ic sm');f.appendChild(s)});
    n.replaceWith(f)}
  function conv(root){
    if(!root)return;
    if(root.nodeType===3){fix(root);return}
    if(root.nodeType!==1)return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;
    while((n=w.nextNode()))if(TEST.test(n.nodeValue))L.push(n);
    L.forEach(fix);
    root.querySelectorAll&&root.querySelectorAll('.feat .em').forEach(e=>{const k=HERO[e.textContent.trim().replace(/️/g,'')];if(k)e.innerHTML=ic(k,'ic lg')});
  }
  let q=[],raf=0;
  new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(x=>q.push(x));if(!raf)raf=requestAnimationFrame(()=>{raf=0;const l=q;q=[];l.forEach(conv)})}).observe(document.body,{childList:true,subtree:true});
  conv(document.body);
})();
</script>
</body></html>
